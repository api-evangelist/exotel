apis:
- aid: exotel:exotel-voice-call-api
  name: Exotel Voice Call API
  tags:
  - Voice
  - Calls
  - IVR
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/api/make-a-call-api
  baseURL: https://api.exotel.com/v1/Accounts
  properties:
  - url: https://developer.exotel.com/api/make-a-call-api
    type: Documentation
  - url: https://developer.exotel.com/api/make-a-call-api
    type: APIReference
  - url: openapi/exotel-openapi.yml
    type: OpenAPI
  - url: collections/exotel.postman_collection.json
    type: PostmanCollection
  - url: collections/exotel.opencollection.json
    type: OpenCollection
  description: Place outbound voice calls via POST /v1/Accounts/{sid}/Calls/connect -
    either connect two phone numbers (call From, then bridge to To) or connect a
    number to an Exotel call flow / applet via the Url parameter. Supports recording,
    time limits, wait audio, and status callbacks.
- aid: exotel:exotel-call-details-api
  name: Exotel Call Details API
  tags:
  - Calls
  - Call Details
  - Reporting
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/api
  baseURL: https://api.exotel.com/v1/Accounts
  properties:
  - url: https://developer.exotel.com/api
    type: Documentation
  - url: openapi/exotel-openapi.yml
    type: OpenAPI
  - url: collections/exotel.postman_collection.json
    type: PostmanCollection
  - url: collections/exotel.opencollection.json
    type: OpenCollection
  description: Retrieve details of a single call by Sid (GET /v1/Accounts/{sid}/Calls/{CallSid})
    including status, direction, duration, price, and recording URL, plus bulk call
    queries filterable by date and status.
- aid: exotel:exotel-sms-api
  name: Exotel SMS API
  tags:
  - SMS
  - Messaging
  - DLT
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/api/sms
  baseURL: https://api.exotel.com/v1/Accounts
  properties:
  - url: https://developer.exotel.com/api/sms
    type: Documentation
  - url: https://developer.exotel.com/docs/sms-api/api-reference/send-sms
    type: APIReference
  - url: openapi/exotel-openapi.yml
    type: OpenAPI
  - url: collections/exotel.postman_collection.json
    type: PostmanCollection
  - url: collections/exotel.opencollection.json
    type: OpenCollection
  description: Send single SMS from an ExoPhone or approved Sender ID via POST
    /v1/Accounts/{sid}/Sms/send, with India DLT entity/template support, encoding and
    priority options, delivery status callbacks, and message-detail lookup.
- aid: exotel:exotel-numbers-api
  name: Exotel Numbers API
  tags:
  - Numbers
  - Metadata
  - Telecom
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/api
  baseURL: https://api.exotel.com/v1/Accounts
  properties:
  - url: https://developer.exotel.com/api
    type: Documentation
  - url: openapi/exotel-openapi.yml
    type: OpenAPI
  - url: collections/exotel.postman_collection.json
    type: PostmanCollection
  - url: collections/exotel.opencollection.json
    type: OpenCollection
  description: Look up telecom metadata for a phone number via GET
    /v1/Accounts/{sid}/Numbers/{Number} - operator/circle, number type, and DND status
    where available for Indian numbers.
- aid: exotel:exotel-campaigns-api
  name: Exotel Campaigns API
  tags:
  - Campaigns
  - Outbound
  - Bulk
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/api
  baseURL: https://api.exotel.com/v2/accounts
  properties:
  - url: https://developer.exotel.com/api
    type: Documentation
  - url: openapi/exotel-openapi.yml
    type: OpenAPI
  - url: collections/exotel.postman_collection.json
    type: PostmanCollection
  - url: collections/exotel.opencollection.json
    type: OpenCollection
  description: Create, list, get, update (pause/resume), and delete bulk outbound call
    campaigns under the v2 API (POST/GET/PUT/DELETE /v2/accounts/{sid}/campaigns), and
    pull per-call records via campaigns/{id}/call-details.
- aid: exotel:exotel-agentstream-voice-streaming-api
  name: Exotel AgentStream Voice Streaming API
  tags:
  - WebSocket
  - Voice Streaming
  - Voicebot
  - Real Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/docs/agentstream/developer-guide
  baseURL: wss://your-bot-host.example.com
  properties:
  - url: https://developer.exotel.com/docs/agentstream/developer-guide
    type: Documentation
  - url: asyncapi/exotel-asyncapi.yml
    type: AsyncAPI
  description: Documented WebSocket (wss://) voice-streaming API. When a call reaches a
    Voicebot or Stream applet, Exotel opens a secure WebSocket to your endpoint and
    streams base64 linear-PCM audio in ~100 ms frames (connected/start/media/dtmf/mark/stop);
    the Voicebot applet is bidirectional so your server sends media/mark/clear back to
    speak to the caller and barge in. Exotel is the WebSocket client; you host the endpoint.
