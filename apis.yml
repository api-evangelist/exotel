name: Exotel
kind: company
description: Exotel is an Indian cloud telephony and customer-engagement (CPaaS)
  platform offering programmable voice, SMS, virtual numbers (ExoPhones), IVR/call
  flows, call campaigns, and call-center tooling. Its Twilio-style REST APIs place
  outbound calls (connect two numbers or connect a number to a call flow), send SMS,
  return call and number metadata, and manage campaigns, over region-specific
  subdomains (api.exotel.com for Singapore, api.in.exotel.com for Mumbai/India) using
  HTTP Basic auth with an API Key and API Token. Exotel AgentStream adds a documented
  WebSocket voice-streaming API for real-time voicebots.
