apis:
- aid: exotel:exotel-agentstream-voice-streaming-api
  name: Exotel AgentStream Voice Streaming API
  tags:
  - WebSocket
  - Voice Streaming
  - Voicebot
  - Real Time
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.exotel.com/docs/agentstream/developer-guide
  baseURL: wss://your-bot-host.example.com
  properties:
  - url: https://developer.exotel.com/docs/agentstream/developer-guide
    type: Documentation
  - url: asyncapi/exotel-asyncapi.yml
    type: AsyncAPI
  description: >-
    Documented WebSocket (wss://) voice-streaming API. When a call reaches a Voicebot or Stream applet,
    Exotel opens a secure WebSocket to your endpoint and streams base64 linear-PCM audio in ~100 ms frames
    (connected/start/media/dtmf/mark/stop); the Voicebot applet is bidirectional so your server sends
    media/mark/clear back to speak to the caller and barge in. Exotel is the WebSocket client; you host
    the endpoint.
