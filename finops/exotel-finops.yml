meters:
- name: voice_minutes
  description: Per-minute voice usage (outbound/inbound), rate varies by number type and destination; drawn from the credit balance.
  unit: minutes
  aggregation: sum
  dimensions:
  - account
  - caller_id
  - number_type
- name: sms_messages
  description: Per-SMS usage, rate tiered by volume; India traffic requires DLT approval.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - sender_id
  - sms_type
- name: whatsapp_conversations
  description: Conversation-based WhatsApp usage plus a per-message platform fee.
  unit: conversations
  aggregation: sum
  dimensions:
  - account
- name: number_rental
  description: Recurring monthly rental (and one-time activation) for virtual numbers / ExoPhones and toll-free numbers.
  unit: numbers
  aggregation: sum
  dimensions:
  - account
  - number_type
- name: agent_seats
  description: Per-seat monthly agent charge for call-center users.
  unit: seats
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track credit-balance burn split by voice minutes, SMS, and WhatsApp; monitor number rentals and seat counts separately from usage.
- name: Allocation
  description: Tag traffic by CallerId/ExoPhone, Sender ID, CustomField, or campaign so shared-credit usage maps to teams/workloads.
- name: Optimization
  description: Right-size the number of rented virtual numbers and agent seats; use call flows to shorten billable minutes; batch and template SMS to reduce failures/retries under DLT.
- name: Accountability
  description: Set owners per ExoPhone/campaign; review prepaid burn rate against bundle refills, factoring 18% GST on Indian invoices.
