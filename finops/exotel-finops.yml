description: >-
  FinOps view of Exotel spend. Exotel bills through a prepaid credit balance
  (1 credit = 1 INR) drawn down by per-minute voice, per-SMS, and
  conversation-based WhatsApp usage, layered on top of recurring
  virtual-number rentals, one-time number activation fees, and per-seat agent
  charges. Indian invoices add 18% GST. Cost is therefore a blend of
  subscription-style commitments (bundles, seats, number rentals) and pure
  usage (minutes and messages), which makes per-workload allocation the main
  FinOps lever.
notes: >-
  Per-unit rates are not reconciled here; verify on exotel.com/pricing. The
  shared credit balance means voice, SMS, and WhatsApp all deplete the same
  pool, so allocation requires tagging traffic (via CallerId/ExoPhone, Sender
  ID, CustomField, or campaign) back to cost centers.
